<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Graphics</title>
        <link rel="stylesheet" href="../css/style.css" type="text/css">
        <link rel="stylesheet" href="../css/graphics.css" type="text/css">

    </head>

    <header>
        <div></div>
        <h1>Meticulous Budgeting</h1>
        <nav>
        <a href="home.html">Home page</a>
        <a href="expenses.html">Add expenses</a>
        <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <div class="graphics_welcome">
        <h2>
            View Your Expenses Here
        </h2>
    </div>

    <main>

        <div class="dashboard">
            <section class="chart-card">
                <div class="chart-card-header">
                    <h3>Monthly Expense Analysis</h3>
                    <div class="chart-type-toggle" id="chartTypeToggle">
                        <button type="button" disabled onclick="setChartType('bar')">Bar</button>
                        <button type="button" disabled onclick="setChartType('line')">Line</button>
                        <button type="button" disabled onclick="setChartType('pie')">Pie</button>
                    </div>
                </div>
                <div class="chart-canvas-wrap">
                    <canvas id="myChart"></canvas>
                </div>
            </section>

            <section class="breakdown-card">
                <h3>50/30/20 Breakdown</h3>
                <ul class="legend-list" id="breakdownList"></ul>

                <div class="warnings-list" id="warningsList"></div>
            </section>
        </div>

    </main>

    <body>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="../javascript/graphics.js"></script>
    </body>
</html>
